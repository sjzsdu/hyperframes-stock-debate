[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocktalk"
version = "0.1.0"
description = "全自动 AI 财报对话视频生成工具"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
stocktalk = "stocktalk.cli:main"

[tool.setuptools.packages.find]
include = ["stocktalk*"]

[tool.setuptools.package-data]
stocktalk = ["templates/hyperframes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
