# 谈股论金默认配置
# 运行时行为见 stocktalk/pipeline.py。

dialogue:
  model: qwen3.6-plus
  # 成片时长目标：2-5 分钟（120-300 秒）。2026-09-20 用户反馈"内容太短、
  # 得不到有效启示"，从原来的 70-110 秒上调——用时长换内容深度。
  # 权衡记录：平台分成只算有效播放，完播率是决定性因素，长片完播率更低，
  # 所以这是"讲透一门生意"优先于"分成最优"的选择，不是免费的。
  # 平台上限不是瓶颈：快手 10 分钟最紧，其余抖音 15 分钟 / 视频号 30 分钟 /
  # B站 120 分钟，5 分钟都留有充足余量。
  # 字数预算 = 秒数 × 4.8 字/秒（实测语速，见 dialogue_generator.SPEECH_CHARS_PER_SECOND）：
  # 120 秒 ≈ 576 字，300 秒 ≈ 1440 字。
  min_duration_seconds: 120
  max_duration_seconds: 300
  # 单轮上限 80 字（约 17 秒）：2026-09-22 用户反馈「轮次多一点、每人一次讲短一点」
  # ——短交锋节奏更像辩论，一人一口气讲 27 秒太闷。轮数按典型单轮 60 字估：
  # 576-1440 字 → 9-24 轮。130 字旧值曾被嫌"一口气太长"。
  max_line_chars: 80
  # 1440 字正文 + 每轮 JSON 结构（speaker/beat/visual）约 3000 token，留一倍余量。
  max_tokens: 8000
  temperature: 0.8
  # 剧本骨架（2026-09-22）。此前"怎么讲"写死在 prompt 字符串里，导致每一期的
  # 节拍序列、开场句式、收尾方式完全一样，看三期就疲（用户反馈）。
  # 骨架注册表见 stocktalk/modules/arcs.py：
  #   auto     按这只票**实际拿得到的数据**挑（默认）：有数据才加这一段，没有就不加，
  #            不硬凑；够格的骨架有多条时按 (代码, 日期) 稳定分散，于是同一只票不同
  #            日子、或不同票之间天然不会撞形，且不依赖任何跨运行状态。
  #   mainline 六层主线（回退用：生意本质→行业→财务→风险→估值→小结）
  #   crack    裂痕式：反常识数字开场→追问代价→数据核对→极短认可→留下分歧
  #   customer 客户视角：谁在买→为什么买→会不会续买→谁能替代→生意小结
  #   annual   年报逐条：收入结构→毛利来源→现金流质量→钱压在哪→隐患
  #   peers    同行对比：同行家数→规模位置→毛利差距→排名证据→小结
  # 想固定成一种风格就写它的 id（例如 annual），想恢复旧观感写 mainline。
  arc: auto
  # 短回应（"嗯""有道理""但是——"）的字数上限：对话该长则长、该短则短，
  # 用户 2026-09-22 明确要求。命中的轮次不再重画画面图板（一句话的认可没必要）。
  short_line_chars: 20
  # Measured end-to-end `bl text chat` latency for a full 2-5 min script is
  # ~90-100s; a short script is faster, but retries each cost the full
  # timeout, so keep a wide margin.
  timeout_seconds: 300

# tongstock connects to the remote TDX server on every invocation, which
# typically takes 20-30s.  The timeout must comfortably exceed that so a
# single stock lookup does not spuriously fail.  Retries are kept low as a
# failed slow command already costs the full timeout each time.
stock_data:
  retries: 0
  timeout_seconds: 60
  # 个股资讯（tongstock news query，东方财富/财联社真实数据）：作为对话创作素材
  # 与「近期资讯」画面的数据源。news_limit 为拉取条数；news_days 为 0 表示不限时间。
  news_limit: 12
  news_days: 0
  # 公司基本面（f10/financials/board）是讲清「这家公司靠什么赚钱」的必需素材。
  # 拿不到就中断并报错——缺口该由 tongstock 补，不在本项目里静默降级成行情点评。
  # 设为 false 只是应急放行（脚本会退化成缺行业锚点的内容），不推荐。
  require_company_data: true

characters:
  bull:
    name: 股市新手
    persona: 年轻乐观的女生，喜欢从生意角度聊公司——这家公司靠什么赚钱、增长从哪来；只讨论已给出的数据
    # 系统音色：龙小淳（知性积极女）——和 bear 的龙橙（智慧青年男）形成辨识度
    voice_id: longxiaochun_v3
    speed: 1.07
    pitch: 1.03
  bear:
    name: 股市老登
    persona: 老练理性，擅长从行业格局和经营风险角度提问，追问生意的短板与数据边界
    # 系统音色：龙橙（智慧青年男）——像懂行的人坐下来聊天，清爽不端着；
    # 之前的龙飞（热血磁性男）开口有电视广告/带货播音腔，已弃用
    voice_id: longcheng_v3
    speed: 1.0
    pitch: 0.96

compliance:
  forbidden_words:
    - 保证
    - 必涨
    - 必跌
    - 稳赚
    - 一定赚

tts:
  model: cosyvoice-v3-flash
  output_format: wav
  # 音频会保留约 60ms 尾音，再留 120ms 对话换气，避免机械空档。
  pause_between_segments: 0.12
  speed: 1.0
  pitch: 1.0
  volume: 1.0
  seed: 20260911
  trim_silence: true
  leading_silence: 0.025
  trailing_silence: 0.06
  fade_seconds: 0.025

video:
  output_dir: output
  quality: high
  # 画幅。horizontal = 1920×1080（默认）；vertical = 1080×1920。
  # 默认横版的原因：抖音/视频号的播放分成硬性要求「原创横屏 ≥1 分钟」，
  # 竖版主片等于把这两家的分成通道关掉（见 publish.platform_canvas 与变现说明）。
  # 想改回竖版主发：这里改 vertical，并把 platform_canvas 换成 douyin/tencent: horizontal。
  canvas: horizontal
  # 画面字幕模式：
  #   line — 一行轮播（默认）。整句按标点切成片段，按字数分配时间逐条显示，
  #          说到哪一句就显示哪一行；横版一行 ≤22 字、竖版 ≤18 字。
  #   full — 整句整块显示（字幕带更高，可动区域更小）。
  #   off  — 不显示画面字幕，完全交给平台自动字幕。
  # 两版画幅都用 line：一行不会因换行把版面上顶，主画面才能保持不动。
  subtitles: line
  # 安全区：平台 App 会在画面上盖自己的 UI（顶部作者/关注栏、底部文案+互动栏、
  # 抖音右侧还有一排竖排按钮），内容只排进安全区才不会被压住。数值是该画幅下的像素。
  #   竖版 240/460：顶部留 240（作者栏），底部留 460（标题+正文+话题+互动栏，
  #                 取各平台公开安全区数据的保守值，Shorts 底部更狠，按需上调）。
  #   横版 120/100：顶部 120 是给 B站的——网页/App 播放器左上角有 logo 与标题，
  #                 60 会和 #headline 重叠（2026-09-18 实测反馈）；其余平台顶上
  #                 没这么宽的遮挡，多留一点只是标题整体下移，无副作用。
  #   side — 左右留边，可拆成 side_left / side_right。竖版 115 对称：手机屏幕
  #         （19.5:9–20:9）全屏播放 9:16 视频时按高铺满、左右各裁 97–108px
  #         （2026-09-22 快手真机实测：side=25 时「最新价」被裁成「新价」），
  #         115 = 盖住最大裁切 + 余量，内容列 850px。历史：25 对称（100×2 的
  #         1/4）是只看预览器定的，预览器不裁边——真机一播就露馅；100×2 曾被
  #         嫌留白大，但那是预览观感，真机裁切才是硬约束。右缘点赞/评论/分享
  #         竖排仍可能压图表下沿（56 曾实测被遮，2026-09-18）——真机被遮再
  #         用 side_right 单独抬。180×2 只剩 720px 太窄、60/140 非对称看着歪
  #         （2026-09-19 反馈）。横版 70 够（横屏播放器信箱式留边，不裁）。
  # 想看这几条带子在哪：预览时给 URL 加 #guides（只在预览显示，不会进成片）。
  safe_area:
    vertical: {top: 240, bottom: 460, side: 115}
    horizontal: {top: 120, bottom: 100, side: 70}
  # MP4 渲染实测常超过 15 分钟（3-8 分钟正片 + 高质量逐帧渲染）。
  # npx 还可能先下载 hyperframes 包，首次更慢；超时大幅放宽并可在用户配置覆盖。
  render_timeout_seconds: 3600
  # Stream captured frames straight into the encoder instead of buffering them on
  # disk (a 4-min 1080p render would otherwise demand ~60GB of temp space).
  parallel_stream_capture: true

# 定时任务的选题（`tangulunjin --auto-pick ...`）。
# 榜单来自 `tongstock topic`：抓取当日各财经媒体的全局资讯，按「标题命中或数据源
# 原生关联」的强度聚合出被提及最多的股票。没配这段也能跑（以下是默认值）。
topics:
  executable: tongstock
  timeout_seconds: 120
  # 同一条目连续失败几次就跳过。1 次失败可能只是抖动；2 次说明这只票本身成不了片
  # （数据缺失/退市），继续钉在它上面会让每个时段都空跑。
  max_runs_per_topic: 2
  # 轮转记忆：记录哪些票已经发过，避免早晚两条重复同一只。
  rotation_file: .topic_rotation.json

# 多平台自动发布（基于 social-auto-upload 的浏览器自动化）。
# 首次使用需逐平台人工扫码登录一次（cookie 会保存）:
#   cd third_party/social-auto-upload && uv run sau <platform> login --account default
# accounts 里每个平台对应一个账号名；headless=true 时上传在后台浏览器执行。
publish:
  # 已开通的发布渠道。未登录或 cookie 失效的平台会在发布前预检时被跳过并提示。
  # 小红书 2026-09-25 恢复：用户要求加回。PLATFORM_SPECS 能力一直在（title 20、
  # tags 10、AI 声明走 --ai-content-label）。已知遗留：本机生成的 3:4 封面在该
  # 平台曾只有背景图（Chrome 截图不稳定）——封面失败只会降级为不带封面发布，
  # 不中断；真复发就先 `sau xiaohongshu upload-video` 裸传观察。
  platforms: [douyin, bilibili, kuaishou, xiaohongshu, tencent, baijiahao]
  # 各平台账号名（对应 sau login --account 时的命名）。
  accounts:
    douyin: default
    bilibili: default
    kuaishou: default
    xiaohongshu: default
    tencent: default
    baijiahao: default
  headless: true
  # AI 生成声明。财经内容不标注 AI 会被限流甚至取消变现资格。快手与小红书走
  # --ai-content-label 通道，选项文案由这里传给上传器（文案若随站点改版变化，
  # 改这里即可，不用动代码）；抖音（内容由AI生成）和视频号（含AI生成内容）由
  # 上传器自行勾选，百家号由上传器勾「含AI生成内容」并回读验证（3 次重试，
  # 失败阻断该平台发布而非裸发）；B站无此字段，声明写在简介里。
  ai_content_label:
    kuaishou: 内容由AI生成
    xiaohongshu: AI生成
  # 发布前用 `sau <platform> check` 预检登录态（每个平台约 10-30 秒）。
  # 渲染一条正片要 8 分钟，先花一分钟拦下 cookie 失效比渲染完再失败划算。
  preflight: true
  check_timeout_seconds: 120
  # 登录态心跳（`tangulunjin --keepalive`）的超时。心跳要真开一次无头浏览器
  # 访问平台后台，比 check 慢；首次判定失效时上传器还会自动复核一次。
  # 视频号是必须心跳的平台：本地 cookie 永不过期，但服务端会话会自己失效。
  # 2026-09-24 定论：服务端会话是**扫码后固定 ≈24 小时绝对过期**，与期间是否活动
  # 无关（09-23 09:07 扫码 → 09-24 09:30 仍有效、09:31 失效 = 24.4h；其间 keepalive
  # 五次全绿也没能续上）。所以「保活续期」在这条链路上结构性不成立，别再往这个
  # 方向投入；心跳的价值是把「发布那一刻才撞上失效」变成「提前几小时就知道」，
  # 它该叫探活而不是保活。当天要发几条，扫码一次就够（24h 窗口覆盖当天所有班次）。
  keepalive_timeout_seconds: 240
  # 自动重新登录（发布预检发现失效时的自救，`--auto-login` / 守护进程 auto_login）的
  # 超时。目前只有视频号会真的走这条路：它的登录页有「微信快捷登录」，本机微信在跑就
  # 免扫码，实测 ~33s 完成，180s 是宽裕上限。**必须远小于上传预算**——快捷登录按钮没
  # 出现时上传器会回落到等扫码，那个等待要在这里被掐掉，不能继承上传的 15 分钟。
  auto_login_timeout_seconds: 180
  # 心跳结果（每个平台最后有效时间 + 最近 24 次判定）落盘位置，相对 output.dir。
  session_state_file: .session_state.json
  # 定时发表（平台侧排期），留空 = 立即发布。命令行 --publish-at 会覆盖这里，
  # 写法：19:30（下一个该时刻）/ +11h（相对现在）/ '2026-09-24 19:30'。
  # 存在意义：会话寿命可能短于两次发布之间的间隔，把「发布时刻」搬进「会话还活着
  # 的那一刻」就不用等会话撑到点——一次登录可以排好后面几条。
  schedule: ""
  # 每个平台想发哪一版画幅。与主画幅不同的平台会额外渲染一次（多一份渲染耗时），
  # 所以这里同时决定了「要渲几版」：列出几个画幅就渲几版。
  # 选版依据（2026-09-18 复核）：
  #   horizontal（桌面版 1920×1080）——抖音/视频号/百家号。前两家的播放分成硬性要求
  #     原创横屏 ≥1 分钟（抖音中视频伙伴计划 0 粉可开；视频号创作者分成 100 粉即可），
  #     发竖版等于自断收益；百家号横版才有播放分成，且上传器强制横版封面。B站横屏生态。
  #   vertical（手机版 1080×1920）——快手。其创作者激励不强制横屏（实名即可开、
  #     发视频就有收益），而流量收益集中在竖屏 9:16（横版点击率明显低）。
  #     若快手后续把分成与横屏挂钩，把这里改回 horizontal 即可。
  platform_canvas:
    douyin: horizontal
    bilibili: horizontal
    kuaishou: vertical
    # 小红书是纯移动端 9:16 平台，走 vertical；与快手共用同一版竖片，
    # 不新增渲染成本（渲染按画幅去重，见 pipeline 的 platform_videos）。
    xiaohongshu: vertical
    tencent: horizontal
    baijiahao: horizontal
  # 每个平台上传的超时；浏览器上传 2-8 分钟视频通常 1-3 分钟完成。
  timeout_seconds: 900
  # 上传失败后在同一轮内自动重试的次数。只重试「上传失败」的平台，
  # 预检失败（cookie 失效）不重试——那种情况要重新登录，重试没意义。
  # 5 个平台里偶发失败很常见，靠这个才能无人值守一次跑完。
  retries: 1
  retry_delay_seconds: 30
  # B站（biliup）会对连续上传限流：upload rate limit (code: 601)「上传视频过快」。
  # 这是**账号级**的：一次 601 之后，紧接着的每次尝试都会重置冷却窗口，10 分钟后
  # 再试只会再吃一个 601。所以：
  #   1) 冷却按次数翻倍（10 → 20 → 40 分钟，上限 rate_limit_max_wait_seconds）；
  #   2) 冷却期写入状态文件，**跨运行生效**——冷却期内的平台直接跳过（不烧请求），
  #      到点后再 `tangulunjin <code> --republish`；
  #   3) 单次运行最多阻塞 rate_limit_block_seconds，超出的不再空等，直接留给补发。
  # 设 rate_limit_wait_seconds: 0 表示限流后不重试（想自己控制节奏时用它）。
  rate_limit_wait_seconds: 600
  rate_limit_max_wait_seconds: 3600
  rate_limit_block_seconds: 600
  # 限流冷却记录（各平台解限时间戳），跨运行共享，避免每次重跑都白烧一次上传。
  state_file: .publish_state.json
  # 抖音发布瞬间可能弹短信验证码风控：sau 检测到后会无声地无限等待验证码。
  # 超过这段时间仍未收到（verify_code.txt 出现即视为收到）就中止该平台并给出提示，
  # 避免白等到 timeout_seconds。设为 0 关闭该保护。
  verify_code_wait_seconds: 150
  # 交互终端下（命令行里跑）遇到上面的验证码风控时，直接在终端提示并等你输入
  # 4-8 位验证码，回车后立刻继续发布；非交互（cron/CI）自动退回「等待写入
  # verify_code.txt」的方式。命令行加 --no-interactive 可临时关闭。
  interactive_verify_code: true
  # 追加到默认话题标签后的自定义标签（每个平台最多取前几个）。
  extra_tags: []
  # 发布时间，留空立即发布；格式 %Y-%m-%d %H:%M，如 "2026-09-16 19:30"（晚高峰）。
  schedule: ""

# 守护进程（`tangulunjin --daemon`）—— 推荐用它代替 cron。
#
# 为什么不是 cron：cron 要求「那个时刻机器是醒着的」，而个人电脑会睡眠、会关机，
# 错过就是错过，它既不补也不说；而且它的时刻是固定的，每天 08:30:00 准时发布，
# 连续一个月，平台的规律性识别几乎不费力。
# 守护进程常驻但**基本不动**：它算出下一个发布时刻，然后睡到那时（不轮询），
# 状态也只在真的变了才落盘 —— 闲着一整夜不碰一次磁盘。发布时刻在窗口内随机取，
# 天天不同。睡眠/关机导致窗口过去，就不发了（不做事后补发，理由见下）。
#
#   tangulunjin --daemon              # 前台跑（能看见日志）
#   tangulunjin --daemon-install      # 装成 launchd 服务：开机自启、退出自动拉起
#   tangulunjin --daemon-status       # 今天几点发、昨天发成没发
daemon:
  # 发布窗口（本地时间）。窗口内**随机**取一个时刻发，所以每天的发布点都不一样。
  # 窗口表达的是「什么时候发都合理」（早晚高峰），不是一个精确时刻。
  # 每天两条就写两个窗口；只发一条就写一个。窗口之间不能重叠。
  # 窗口也是硬边界：过了就不发了 —— 所以窗口别太窄，它是你唯一的容错。
  windows:
    - "07:30-09:30"
    - "18:30-21:00"
  # 两次睁眼之间最多睡这么久（秒）。默认 15 分钟。
  #
  # 为什么不一觉睡到下一个发布时刻（可能隔一整夜）：macOS 的单调时钟在系统睡眠期间
  # **不走字**，一觉 13 小时睡下去、中途合盖两小时，醒来时计时器还剩 11 小时 ——
  # 那一档就被无声地睡过去了。分片睡觉让计时误差永远压在 15 分钟以内，而每次醒来
  # 只做一次内存里的时间比较（微秒级），一天不到 100 次，实测可以忽略。
  max_sleep_seconds: 900
  # 每隔几小时往日志写一行「我还在看表，下一次是 X」。守护进程最糟的状态不是报错
  # 而是安静 —— 你会分不清它是「今天没事干」还是「昨晚就死了」。设 0 关闭心跳。
  heartbeat_hours: 6
  # 失败（渲染挂了、上传超时、选题拉不到榜单）后的重试冷却与次数上限。
  # 重试会重新选题，所以连着失败会自动换一只票，不会钉死在同一只上。
  # 注意重试也受窗口约束：窗口过了就认，不会为了重试而越界发布。
  retry_minutes: 45
  max_attempts: 3
  # 单次全链路（生成 + 渲染 + 发布）的超时上限，超过就当失败杀掉。
  run_timeout_seconds: 7200
  # 有平台登录失效时，是否跳过它继续发其余平台。守护进程默认 true：凌晨三点没人
  # 能回答「继续吗」，而「发到 4/5 个平台」永远好过「一个都不发」。被跳过的平台
  # 会记进 sidecar，登录好后用 `tangulunjin <code> --republish` 补上。
  continue_on_login_failure: true
  # 掉线的平台先自己试着登回来（等价于给每次运行加 --auto-login）。目前只有视频号
  # 有这个能力：它的登录页有「微信快捷登录」，本机微信在跑就不必扫码，实测 ~33s 静默
  # 完成。触发条件很窄（平台**确认失效** + 微信在跑），不会覆盖有效的 cookie，所以默认
  # 打开；其余平台仍要人工扫码，只会被记录下来。关掉就完全回到「失效即跳过」。
  auto_login: true
  # 额外传给每次运行的参数（默认已带 --auto-pick --publish --no-interactive）。
  # 例：想改走平台定时发表，这里加 "--publish-at", "+3h"。
  extra_args: []
  # 状态文件（相对 output.dir）：排期、每次的退出码、累计成败都在这里。
  state_file: .daemon_state.json
  # 运行日志（相对 output.dir）：每次运行的完整输出都追加进来。
  log_file: daemon.log
  # 装 launchd 服务时额外加进 PATH 的目录。默认清单已经覆盖 ~/.local/bin（uv、
  # tongstock）、/opt/homebrew/bin、/usr/local/bin 和当前 venv；只有把 node 装在
  # 别处（如 nvm）时才需要在这里补。
  path: []

# 结果反馈：每次定时运行结束后，把「发了什么、成没成」推给你。
#
# 无人值守最糟的失败不是报错，而是安静 —— 片子没发出去，三天后才发现。日志和状态
# 文件都躺在 output/ 里，没人会主动去看一个「应该没事」的目录，所以每次跑完都要
# 主动敲一下人：成功、部分成功、失败、错过窗口、被异常拉起，各推一条。
#
# 通知是旁路：任何通道发不出去都只写一行日志，绝不会影响发布本身。
notify:
  # false = 关掉反馈，结果只留在 output/daemon.log 和 .daemon_state.json 里。
  enabled: true
  # 什么情况下推。**成功也推是有意的**：只在失败时说话，你会把通知和「出事」画
  # 等号，而没收到通知时又分不清「今天没事」和「它昨晚就死了」。
  on_success: true    # 全平台发成功
  on_partial: true    # 发出去一部分（其余掉线/限流冷却/上传失败）
  on_failure: true    # 一个平台都没发出去
  on_missed: true     # 窗口过了没发（连续漏掉几档会合并成一条，不刷屏）
  on_restart: true    # 守护进程异常退出后被拉起
  on_test: true       # --notify-test 自检
  # 推送通道，按顺序逐个发，互不影响。没填 url/host/command 的通道＝还没启用，
  # 会被静默跳过（所以可以把打算用的都留在这里，填哪个哪个就活）。
  channels:
    # ① 本机通知中心：零配置、零凭据，人在电脑前就立刻到。缺点同样明确 —— 人不在
    #    电脑前只剩通知中心的历史记录，所以它不该是唯一通道。
    #    第一次没收到的话，去「系统设置 → 通知 → 脚本编辑器」把它打开：launchd 起的
    #    进程没有 bundle，系统会把通知算在「脚本编辑器」名下。
    - kind: macos
    # ② 手机推送。type 可选 wecom / dingtalk / feishu / bark（iOS，GET 形式）/
    #    json（裸 JSON POST，自己接）。
    #    企业微信最省事：建一个只有自己的群 → 群设置 → 群机器人 → 添加 → 复制
    #    Webhook 地址粘到下面。注意 webhook 地址本身就是密钥，别提交到仓库。
    - kind: webhook
      type: wecom
      url: ""
    # ③ 邮件：能归档、能搜索，适合「事后翻一下上个月发了几条」。
    #    密码只从环境变量读，不写进配置文件：export TANGULUNJIN_SMTP_PASSWORD=...
    - kind: smtp
      host: ""                                   # 如 smtp.qq.com
      port: 465                                  # 465 = SSL，587 = STARTTLS
      user: ""
      password_env: TANGULUNJIN_SMTP_PASSWORD
      to: ""                                     # 逗号分隔的收件人
    # ④ 逃生舱：任何能收一条命令的推送工具（ntfy / pushover / 自己写的脚本）。
    #    命令里写 {report} 会替换成一份 JSON 的路径；不写则把 JSON 喂给 stdin。
    #    例：command: "ntfy publish mytopic \"$(cat)\"" 之类，按工具的用法写即可。
    - kind: command
      command: ""
  # macOS 通知的提示音（留空则静音）。
  sound:
    success: "Glass"
    failure: "Basso"
  # 每个通道的超时（秒）。网络卡住不该拖住排期。
  timeout_seconds: 15

# 封面图（headless Chrome 截图，随发布一起下发）。
# 尺寸按各平台实际支持的能力自动裁剪，平台与参数对应关系见
# stocktalk/modules/publisher.py 的 PLATFORM_SPECS[platform]["covers"]：
#   portrait  1080×1440（3:4）—— 抖音/快手/小红书/视频号
#   landscape 1080×810 （4:3）—— 抖音与视频号的横版封面位
#   wide      1440×810（16:9）—— B站封面
# 封面失败只会降级为「不带封面发布」，不会中断发布。
cover:
  enabled: true
  # 留空自动探测（macOS 的 Google Chrome / Chromium / Edge，再退到 PATH）。
  chrome_path: ""
  # 单张封面的截图超时。Chrome 截完图后常被辅助进程拖着不退出，
  # 这里靠轮询产物文件判断完成，因此超时值只影响异常情况。
  timeout_seconds: 90
  # 截图前的虚拟时间预算，等待字体与 CSS 渐变就绪。
  virtual_time_budget_ms: 4000

output:
  dir: output
