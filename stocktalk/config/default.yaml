# StockTalk default configuration
# See stocktalk/pipeline.py for runtime behaviour.

dialogue:
  model: qwen3.6-plus
  min_duration_seconds: 120
  max_duration_seconds: 300
  max_line_chars: 130
  max_tokens: 3200
  temperature: 0.8
  timeout_seconds: 90

# tongstock connects to the remote TDX server on every invocation, which
# typically takes 20-30s.  The timeout must comfortably exceed that so a
# single stock lookup does not spuriously fail.  Retries are kept low as a
# failed slow command already costs the full timeout each time.
stock_data:
  retries: 0
  timeout_seconds: 60

characters:
  bull:
    name: 股市新手
    persona: 年轻乐观的女生，喜欢从生意角度聊公司——这家公司靠什么赚钱、增长从哪来；只讨论已给出的数据
    # 龙小淳：知性积极女。比甜美营销腔更适合财经新手，又保留年轻感。
    voice_id: longxiaochun_v3
    speed: 1.07
    pitch: 1.03
    voice_direction: 年轻、好奇、聪明又有一点兴奋的女生语气，自然聊天，不要播音腔；关键数字稍微重读，句尾利落。
  bear:
    name: 股市老登
    persona: 老练理性，擅长从行业格局和经营风险角度提问，追问生意的短板与数据边界
    # 龙天：磁性理智男。低沉但不夸张，符合见过周期的老股民。
    voice_id: longtian_v3
    speed: 0.94
    pitch: 0.92
    voice_direction: 成熟、低沉、克制的男性语气，像见过几轮牛熊的老股民在聊天；带一点审慎质疑，停顿自然，不要新闻播报腔。

compliance:
  forbidden_words:
    - 保证
    - 必涨
    - 必跌
    - 稳赚
    - 一定赚

tts:
  model: cosyvoice-v3-flash
  output_format: wav
  # 音频会保留约 60ms 尾音，再留 120ms 对话换气，避免机械空档。
  pause_between_segments: 0.12
  speed: 1.0
  pitch: 1.0
  volume: 1.0
  seed: 20260911
  trim_silence: true
  leading_silence: 0.025
  trailing_silence: 0.06
  fade_seconds: 0.025

video:
  output_dir: output
  quality: high

output:
  dir: output
