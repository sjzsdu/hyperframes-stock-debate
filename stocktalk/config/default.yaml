# StockTalk default configuration
# See stocktalk/pipeline.py for runtime behaviour.

dialogue:
  model: qwen3.6-plus
  min_duration_seconds: 120
  max_duration_seconds: 300
  max_line_chars: 130
  max_tokens: 3200
  temperature: 0.8
  timeout_seconds: 90

# tongstock connects to the remote TDX server on every invocation, which
# typically takes 20-30s.  The timeout must comfortably exceed that so a
# single stock lookup does not spuriously fail.  Retries are kept low as a
# failed slow command already costs the full timeout each time.
stock_data:
  retries: 0
  timeout_seconds: 60

characters:
  bull:
    name: 股市新手
    persona: 年轻乐观，喜欢从生意角度聊公司——这家公司靠什么赚钱、增长从哪来；只讨论已给出的数据
    voice_id: longcheng_v3
  bear:
    name: 股市老登
    persona: 老练理性，擅长从行业格局和经营风险角度提问，追问生意的短板与数据边界
    voice_id: longyingjing_v3

compliance:
  forbidden_words:
    - 保证
    - 必涨
    - 必跌
    - 稳赚
    - 一定赚

tts:
  model: cosyvoice-v3-flash
  output_format: wav
  pause_between_segments: 0.25
  speed: 1.0
  pitch: 1.0
  volume: 1.0

video:
  output_dir: output
  quality: high

output:
  dir: output
