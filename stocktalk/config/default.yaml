# StockTalk default configuration
# See stocktalk/pipeline.py for runtime behaviour.

dialogue:
  model: qwen3.6-plus
  rounds: 3
  max_line_chars: 56
  max_tokens: 1600
  temperature: 0.65
  timeout_seconds: 90

# tongstock connects to the remote TDX server on every invocation, which
# typically takes 20-30s.  The timeout must comfortably exceed that so a
# single stock lookup does not spuriously fail.  Retries are kept low as a
# failed slow command already costs the full timeout each time.
stock_data:
  retries: 0
  timeout_seconds: 60

characters:
  bull:
    name: 股市新手
    persona: 年轻乐观，容易被利好消息带动，只讨论已给出的数据
    voice_id: longfeifei_v3
  bear:
    name: 股市老登
    persona: 老练理性，擅长从风险角度分析，质疑数据边界
    voice_id: longtian_v3

compliance:
  forbidden:
    - 保证
    - 必涨
    - 必跌
    - 稳赚
    - 一定赚
  disclaimer: 内容为虚拟人物观点碰撞，不构成投资建议。投资有风险，入市需谨慎。

output:
  dir: output

video:
  output_dir: output
  quality: high
