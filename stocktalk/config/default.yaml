# 谈股论金默认配置
# 运行时行为见 stocktalk/pipeline.py。

dialogue:
  model: qwen3.6-plus
  # 成片时长目标：70-110 秒。平台播放分成只算「有效播放」，完播率是决定性因素，
  # 3 分钟以上的长片完播率通常跌到 20% 以下，实际分成反而不如 90 秒的短片。
  # 语速约 2.8 字/秒，110 秒 ≈ 300 字正文，见 max_line_chars 与 _user_prompt 的字数预算。
  min_duration_seconds: 70
  max_duration_seconds: 110
  max_line_chars: 90
  # 2 分钟对话正文约 250-350 字，JSON 开销另计。
  max_tokens: 2500
  temperature: 0.8
  # Measured end-to-end `bl text chat` latency for a full 2-5 min script is
  # ~90-100s; a short script is faster, but retries each cost the full
  # timeout, so keep a wide margin.
  timeout_seconds: 180

# tongstock connects to the remote TDX server on every invocation, which
# typically takes 20-30s.  The timeout must comfortably exceed that so a
# single stock lookup does not spuriously fail.  Retries are kept low as a
# failed slow command already costs the full timeout each time.
stock_data:
  retries: 0
  timeout_seconds: 60
  # 个股资讯（tongstock news query，东方财富/财联社真实数据）：作为对话创作素材
  # 与「近期资讯」画面的数据源。news_limit 为拉取条数；news_days 为 0 表示不限时间。
  news_limit: 12
  news_days: 0
  # 公司基本面（f10/financials/board）是讲清「这家公司靠什么赚钱」的必需素材。
  # 拿不到就中断并报错——缺口该由 tongstock 补，不在本项目里静默降级成行情点评。
  # 设为 false 只是应急放行（脚本会退化成缺行业锚点的内容），不推荐。
  require_company_data: true

characters:
  bull:
    name: 股市新手
    persona: 年轻乐观的女生，喜欢从生意角度聊公司——这家公司靠什么赚钱、增长从哪来；只讨论已给出的数据
    # 系统音色：龙小淳（知性积极女）——和 bear 的龙橙（智慧青年男）形成辨识度
    voice_id: longxiaochun_v3
    speed: 1.07
    pitch: 1.03
  bear:
    name: 股市老登
    persona: 老练理性，擅长从行业格局和经营风险角度提问，追问生意的短板与数据边界
    # 系统音色：龙橙（智慧青年男）——像懂行的人坐下来聊天，清爽不端着；
    # 之前的龙飞（热血磁性男）开口有电视广告/带货播音腔，已弃用
    voice_id: longcheng_v3
    speed: 1.0
    pitch: 0.96

compliance:
  forbidden_words:
    - 保证
    - 必涨
    - 必跌
    - 稳赚
    - 一定赚

tts:
  model: cosyvoice-v3-flash
  output_format: wav
  # 音频会保留约 60ms 尾音，再留 120ms 对话换气，避免机械空档。
  pause_between_segments: 0.12
  speed: 1.0
  pitch: 1.0
  volume: 1.0
  seed: 20260911
  trim_silence: true
  leading_silence: 0.025
  trailing_silence: 0.06
  fade_seconds: 0.025

video:
  output_dir: output
  quality: high
  # 画幅。horizontal = 1920×1080（默认）；vertical = 1080×1920。
  # 默认横版的原因：抖音/视频号的播放分成硬性要求「原创横屏 ≥1 分钟」，
  # 竖版主片等于把这两家的分成通道关掉（见 publish.platform_canvas 与变现说明）。
  # 想改回竖版主发：这里改 vertical，并把 platform_canvas 换成 douyin/tencent: horizontal。
  canvas: horizontal
  # 画面字幕模式：
  #   line — 一行轮播（默认）。整句按标点切成片段，按字数分配时间逐条显示，
  #          说到哪一句就显示哪一行；横版一行 ≤22 字、竖版 ≤18 字。
  #   full — 整句整块显示（字幕带更高，可动区域更小）。
  #   off  — 不显示画面字幕，完全交给平台自动字幕。
  # 两版画幅都用 line：一行不会因换行把版面上顶，主画面才能保持不动。
  subtitles: line
  # 安全区：平台 App 会在画面上盖自己的 UI（顶部作者/关注栏、底部文案+互动栏、
  # 抖音右侧还有一排竖排按钮），内容只排进安全区才不会被压住。数值是该画幅下的像素。
  #   竖版 240/460：顶部留 240（作者栏），底部留 460（标题+正文+话题+互动栏，
  #                 取各平台公开安全区数据的保守值，Shorts 底部更狠，按需上调）。
  #   横版 120/100：顶部 120 是给 B站的——网页/App 播放器左上角有 logo 与标题，
  #                 60 会和 #headline 重叠（2026-09-18 实测反馈）；其余平台顶上
  #                 没这么宽的遮挡，多留一点只是标题整体下移，无副作用。
  #   side — 左右留边，可拆成 side_left / side_right。竖版 25 对称（100×2 的
  #         1/4，2026-09-19 用户反馈两侧留白仍太大）：内容列 1030px；代价是
  #         抖音/快手右缘的点赞/评论/分享竖排可能压住图表右端文字（56 曾实测
  #         被遮，2026-09-18）——真机验证若被遮，用 side_right 单独抬高右缘。
  #         180×2 只剩 720px 太窄、60/140 非对称看着歪（2026-09-19 反馈）。
  #         横版 70 够。
  # 想看这几条带子在哪：预览时给 URL 加 #guides（只在预览显示，不会进成片）。
  safe_area:
    vertical: {top: 240, bottom: 460, side: 25}
    horizontal: {top: 120, bottom: 100, side: 70}
  # MP4 渲染实测常超过 15 分钟（3-8 分钟正片 + 高质量逐帧渲染）。
  # npx 还可能先下载 hyperframes 包，首次更慢；超时大幅放宽并可在用户配置覆盖。
  render_timeout_seconds: 3600
  # Stream captured frames straight into the encoder instead of buffering them on
  # disk (a 4-min 1080p render would otherwise demand ~60GB of temp space).
  parallel_stream_capture: true

# 多平台自动发布（基于 social-auto-upload 的浏览器自动化）。
# 首次使用需逐平台人工扫码登录一次（cookie 会保存）:
#   cd third_party/social-auto-upload && uv run sau <platform> login --account default
# accounts 里每个平台对应一个账号名；headless=true 时上传在后台浏览器执行。
publish:
  # 已开通的发布渠道。未登录或 cookie 失效的平台会在发布前预检时被跳过并提示。
  # 小红书 2026-09-18 停发：本机生成的封面只有背景图（Chrome 截图在该模板上不稳定），
  # 用户决定移除；PLATFORM_SPECS 里的能力保留，想恢复加回列表 + `sau xiaohongshu login` 即可。
  platforms: [douyin, bilibili, kuaishou, tencent, baijiahao]
  # 各平台账号名（对应 sau login --account 时的命名）。
  accounts:
    douyin: default
    bilibili: default
    kuaishou: default
    tencent: default
    baijiahao: default
  headless: true
  # AI 生成声明。财经内容不标注 AI 会被限流甚至取消变现资格。快手（现唯一走
  # --ai-content-label 通道的平台；小红书已停发）的选项文案由这里传给上传器，
  # 文案若随站点改版变化，改这里即可，不用动代码；抖音（内容由AI生成）和
  # 视频号（含AI生成内容）由上传器自行勾选，B站/百家号无此字段，声明写在简介里。
  ai_content_label:
    kuaishou: 内容由AI生成
  # 发布前用 `sau <platform> check` 预检登录态（每个平台约 10-30 秒）。
  # 渲染一条正片要 8 分钟，先花一分钟拦下 cookie 失效比渲染完再失败划算。
  preflight: true
  check_timeout_seconds: 120
  # 每个平台想发哪一版画幅。与主画幅不同的平台会额外渲染一次（多一份渲染耗时），
  # 所以这里同时决定了「要渲几版」：列出几个画幅就渲几版。
  # 选版依据（2026-09-18 复核）：
  #   horizontal（桌面版 1920×1080）——抖音/视频号/百家号。前两家的播放分成硬性要求
  #     原创横屏 ≥1 分钟（抖音中视频伙伴计划 0 粉可开；视频号创作者分成 100 粉即可），
  #     发竖版等于自断收益；百家号横版才有播放分成，且上传器强制横版封面。B站横屏生态。
  #   vertical（手机版 1080×1920）——快手。其创作者激励不强制横屏（实名即可开、
  #     发视频就有收益），而流量收益集中在竖屏 9:16（横版点击率明显低）。
  #     若快手后续把分成与横屏挂钩，把这里改回 horizontal 即可。
  platform_canvas:
    douyin: horizontal
    bilibili: horizontal
    kuaishou: vertical
    tencent: horizontal
    baijiahao: horizontal
  # 每个平台上传的超时；浏览器上传 2-8 分钟视频通常 1-3 分钟完成。
  timeout_seconds: 900
  # 上传失败后在同一轮内自动重试的次数。只重试「上传失败」的平台，
  # 预检失败（cookie 失效）不重试——那种情况要重新登录，重试没意义。
  # 5 个平台里偶发失败很常见，靠这个才能无人值守一次跑完。
  retries: 1
  retry_delay_seconds: 30
  # B站（biliup）会对连续上传限流：upload rate limit (code: 601)「上传视频过快」。
  # 这是**账号级**的：一次 601 之后，紧接着的每次尝试都会重置冷却窗口，10 分钟后
  # 再试只会再吃一个 601。所以：
  #   1) 冷却按次数翻倍（10 → 20 → 40 分钟，上限 rate_limit_max_wait_seconds）；
  #   2) 冷却期写入状态文件，**跨运行生效**——冷却期内的平台直接跳过（不烧请求），
  #      到点后再 `tangulunjin <code> --republish`；
  #   3) 单次运行最多阻塞 rate_limit_block_seconds，超出的不再空等，直接留给补发。
  # 设 rate_limit_wait_seconds: 0 表示限流后不重试（想自己控制节奏时用它）。
  rate_limit_wait_seconds: 600
  rate_limit_max_wait_seconds: 3600
  rate_limit_block_seconds: 600
  # 限流冷却记录（各平台解限时间戳），跨运行共享，避免每次重跑都白烧一次上传。
  state_file: .publish_state.json
  # 抖音发布瞬间可能弹短信验证码风控：sau 检测到后会无声地无限等待验证码。
  # 超过这段时间仍未收到（verify_code.txt 出现即视为收到）就中止该平台并给出提示，
  # 避免白等到 timeout_seconds。设为 0 关闭该保护。
  verify_code_wait_seconds: 150
  # 交互终端下（命令行里跑）遇到上面的验证码风控时，直接在终端提示并等你输入
  # 4-8 位验证码，回车后立刻继续发布；非交互（cron/CI）自动退回「等待写入
  # verify_code.txt」的方式。命令行加 --no-interactive 可临时关闭。
  interactive_verify_code: true
  # 追加到默认话题标签后的自定义标签（每个平台最多取前几个）。
  extra_tags: []
  # 发布时间，留空立即发布；格式 %Y-%m-%d %H:%M，如 "2026-09-16 19:30"（晚高峰）。
  schedule: ""

# 封面图（headless Chrome 截图，随发布一起下发）。
# 尺寸按各平台实际支持的能力自动裁剪，平台与参数对应关系见
# stocktalk/modules/publisher.py 的 PLATFORM_SPECS[platform]["covers"]：
#   portrait  1080×1440（3:4）—— 抖音/快手/小红书/视频号
#   landscape 1080×810 （4:3）—— 抖音与视频号的横版封面位
#   wide      1440×810（16:9）—— B站封面
# 封面失败只会降级为「不带封面发布」，不会中断发布。
cover:
  enabled: true
  # 留空自动探测（macOS 的 Google Chrome / Chromium / Edge，再退到 PATH）。
  chrome_path: ""
  # 单张封面的截图超时。Chrome 截完图后常被辅助进程拖着不退出，
  # 这里靠轮询产物文件判断完成，因此超时值只影响异常情况。
  timeout_seconds: 90
  # 截图前的虚拟时间预算，等待字体与 CSS 渐变就绪。
  virtual_time_budget_ms: 4000

output:
  dir: output
